spring.application.name=careerly-api
server.port=3000
spring.datasource.url=jdbc:mysql://localhost:3306/careerly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
careerly.jwt.secret=replace-with-a-32-character-minimum-development-secret
careerly.jwt.expiration-hours=8
careerly.upload-dir=uploads
